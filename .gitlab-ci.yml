---
# =============================================================================
# example-org/renovate — central Renovate runner for the homelab GitLab group.
#
# This is the single, dedicated runner project recommended by the upstream
# renovate-runner project (https://gitlab.com/renovate-bot/renovate-runner).
# One project, one schedule, one shared cache, and one group token autodiscover
# and update every `homelab/*` repository that contains a `renovate.json`. It
# replaces the four per-repo `renovate:` jobs that previously each ran on their
# own pipeline and schedule.
#
# This project also hosts the shared base preset (`default.json`). Every
# repository extends it via `local>example-org/renovate`, and this runner's own
# `renovate.json` extends both the preset and the upstream runner preset so the
# template ref and engine image stay current.
#
# Secrets: HashiCorp Vault kv/ci/renovate, read at job start by
# scripts/vault-env.mjs (an id_tokens login as role ci-renovate; schedules run
# on the protected main branch):
#   token                GitLab group access token (scopes: api, read_user,
#                        write_repository) → RENOVATE_TOKEN. Authorises the
#                        bot to read and update every homelab/* repository.
#   github_com_token     github.com read-only PAT → GITHUB_COM_TOKEN. Raises
#                        the github.com API limit from 60/hr (anonymous) to
#                        5000/hr for datasource lookups and changelog fetching.
#   docker_hub_username  Docker Hub credentials, added to RENOVATE_HOST_RULES
#   docker_hub_token     at job start.
#
# Trigger: one daily pipeline schedule on this project (cron `0 3 * * *`,
# Europe/Berlin). The renovate job runs on schedules only (see the upstream
# template's rules); start the first run with the schedule's play button.
# =============================================================================

# Pin every job to the homelab gitlab-runner (Docker executor, tags:[docker]),
# as every homelab repo does. A new project does not inherit a tag, and the
# runner only serves `docker`-tagged jobs, so an untagged renovate job stays
# stuck in pending.
default:
  tags:
    - docker
  # Superseded pipelines auto-cancel (workflow:auto_cancel below). Jobs with
  # side effects (renovate, mirror) opt back out.
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never

include:
  # Upstream renovate-runner template; provides the hidden `.renovate` job and
  # the `renovate` job (schedule-gated). The ref is Renovate-tracked via this
  # project's renovate.json (gitlab>renovate-bot/renovate-runner preset). Pulled
  # remotely from gitlab.com — no in-house mirror of the template is required.
  - remote: https://gitlab.com/renovate-bot/renovate-runner/-/raw/v26.1.0/templates/renovate.gitlab-ci.yml
  # Bypass-proof secret scan, like every other homelab repo. This repo has no
  # thin CI image, so CI_IMAGE (below) points straight at ci-base; the gitleaks
  # config comes from the defaults baked into ci-base at /opt/ci/config/.
  - component: $CI_SERVER_FQDN/homelab/ci-components/scan-secrets@4.5.0
  # Conventional-commit gate on MRs (group-wide commit grammar).
  - component: $CI_SERVER_FQDN/homelab/ci-components/lint-commits@4.5.0
  # The same YAML and Markdown checks the pre-commit hooks run.
  - component: $CI_SERVER_FQDN/homelab/ci-components/lint-yaml@4.5.0
  - component: $CI_SERVER_FQDN/homelab/ci-components/lint-markdown@4.5.0
  # The repo against ci-components docs/REPO-STANDARD.md; exceptions in
  # .ci/repo-standard.yaml.
  - component: $CI_SERVER_FQDN/homelab/ci-components/lint-repo-standard@4.5.0
  # GitHub portfolio mirror. This repo has no thin CI image, so the mirror runs
  # on ci-base directly (it carries the /opt/ci publish tooling + sanitize-base).
  # Pinned to >=2.1.2: the mirror job must not ingest the renovate job's
  # debug-log artifact (dependencies: [] fix).
  # Failure alert for main pipelines (ntfy topic gitlab-pipelines).
  - component: $CI_SERVER_FQDN/homelab/ci-components/notify-ntfy@4.5.0
  - component: $CI_SERVER_FQDN/homelab/ci-components/mirror-github@4.5.0
    inputs:
      vault: true
      image: $HARBOR_HOST/homelab/ci-components/ci:latest
      repo_name: renovate

# deploy is where the upstream template's `renovate` job runs (its hardcoded
# stage); mirror is the GitHub mirror.
stages:
  - scan
  - lint
  - validate
  - deploy
  - mirror

# -----------------------------------------------------------------------------
# Server-side validation of the preset files that govern the whole estate.
# Every consumer extends default.json (and the modular presets), so a syntax or
# schema error here breaks dependency updates for all repos — pre-commit's
# local renovate-config-validator can be bypassed; this job cannot.
# -----------------------------------------------------------------------------
validate:renovate-config:
  stage: validate
  image: $CI_RENOVATE_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &config-changes
        - "*.json"
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes: *config-changes
  script:
    - renovate-config-validator --strict default.json dockerfile-args.json ci-components.json renovate.json

variables:
  # Pin the Renovate engine to a digest-free minor tag (Renovate-tracked). One
  # version governs the whole homelab. The upstream template defaults this to a
  # floating major tag, which we intentionally override for reproducibility.
  CI_RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.239

  # Image for the scan-secrets component (its image input defaults to
  # $CI_IMAGE). This repo has no thin CI image of its own — ci-base is enough.
  CI_IMAGE: $HARBOR_HOST/homelab/ci-components/ci:latest

  # Discover every homelab/* project the RENOVATE_TOKEN can see that already has
  # a renovate.json. `--onboarding=false` means no onboarding PRs are opened for
  # un-configured projects, and the `homelab/*` filter keeps the bot off any
  # other group the token might reach.
  RENOVATE_EXTRA_FLAGS: --autodiscover=true --autodiscover-filter=homelab/* --onboarding=false

  # Persist repo data between runs so Renovate can `git fetch` instead of a full
  # `git clone` each time. Complements the template's
  # RENOVATE_REPOSITORY_CACHE=enabled and the widened cache.paths below.
  RENOVATE_PERSIST_REPO_DATA: "true"

  # Post-upgrade command execution. proxmox-infra (scripts/renovate-update-sha256.sh),
  # argo-apps (scripts/renovate-vendor-chart.sh, re-vendors the postgresql and
  # valkey charts) and helm-charts (an inline `sed` appVersion bump) define
  # postUpgradeTasks in their own renovate.json; the allow-list is a trusted, bot-side setting that
  # must live here, not in repo config. Commands run against each repository's
  # own cloned checkout under autodiscover.
  RENOVATE_ALLOW_POST_UPGRADE_COMMAND_TEMPLATING: "true"
  RENOVATE_ALLOWED_COMMANDS: '["^sed ", "^scripts/renovate-update-sha256\\.sh ", "^scripts/renovate-vendor-chart\\.sh "]'

  # Docker Hub datasource lookups are authenticated to avoid anonymous
  # pull-rate limits: the renovate job's before_script adds that entry with
  # the credentials from Vault, because GitLab expands variables here before
  # the job can read them.
  #
  # The registry and git entries carry no credentials; they exist to grant
  # internal-host access. Renovate 44.79 classifies a host by its RESOLVED IP,
  # not its name, so these FQDNs count as internal (they resolve into 10/8).
  # internalHostAccess defaults to `warn` today and
  # becomes `block` in a future major, which would cut off Harbor OCI chart
  # lookups estate-wide. allowInternal is globalOnly — it is a config
  # VALIDATION ERROR in a repo renovate.json, so it must live here.
  RENOVATE_HOST_RULES: '[{"matchHost":"https://registry.example.com","allowInternal":true},{"matchHost":"https://source.example.com","allowInternal":true}]'

  VAULT_ADDR: https://vault.example.com:8200

renovate:
  # A push to main must not cancel a running pass halfway through its MRs.
  interruptible: false
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  # The assignment fails the job on a refused login; `eval` alone would not.
  before_script:
    - VAULT_ENV="$(node scripts/vault-env.mjs ci-renovate ci/renovate token=RENOVATE_TOKEN github_com_token=GITHUB_COM_TOKEN docker_hub_username=DOCKER_HUB_USERNAME docker_hub_token=DOCKER_HUB_TOKEN)"
    - eval "$VAULT_ENV"
    - >-
      RENOVATE_HOST_RULES="$(node -e 'const r = JSON.parse(process.env.RENOVATE_HOST_RULES);
      r.unshift({matchHost: "docker.io", hostType: "docker", username: process.env.DOCKER_HUB_USERNAME, password: process.env.DOCKER_HUB_TOKEN});
      process.stdout.write(JSON.stringify(r));')"
    - export RENOVATE_HOST_RULES
  # Override only the cache paths. The upstream template caches just
  # `renovate/cache/renovate/repository/` (the repository cache) and not the
  # datasource HTTP cache, so GitHub tag/release lookups were re-fetched cold on
  # every run. Persisting the whole `renovate/cache/` tree keeps those lookups
  # warm between runs. The cache key matches the template's (`<ref>-renovate`).
  cache:
    key: ${CI_COMMIT_REF_SLUG}-renovate
    paths:
      - renovate/cache/
